<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GIGA句会プラザ</title>
  <!--
    viewport は code.gs の addMetaTag でも指定している（GAS は画面を iframe で
    包むため、外枠側にも要る）。拡大は禁止しない。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    React・Tailwind・紙吹雪は、CDN ではなく GAS 側に置いてある。
    以前は cdn.tailwindcss.com と unpkg から読み、さらに @babel/standalone で
    JSX をブラウザの中でコンパイルしていた。学校のフィルタリングでこれらが
    塞がれると **画面がまったく出ない**（白いまま何も起きない）。
    先に作っておけば、その事故は起きない。作り方は tools/build.mjs にある。
  -->
  <?!= include('vendor'); ?>
  <?!= include('css'); ?>

  <!--
    和風フォント（Yuji Syuku）。生成物です。作り直すには npm run build:fonts。

    ⚠️ ここに Google Fonts への <link> を戻さないこと。フィルタが「握ったまま
       返さない」形で塞ぐと、スタイルシートの読み込みが終わらず script が
       動き出さず、真っ白のまま何も起きません（Quarto で 2026-08-23 に実際に起きた）。

    ⚠️ 収録は「画面に出る字＋小学1〜2年の配当漢字」までです。
       俳句は児童が打つものなので、どの字が来るかは先に分かりません。
       ここに無い字は端末の明朝体に落ちます（豆腐にはなりません）。
       もっと広げたいときは fonts.config.json の grades を増やしてください
       （1〜6年まで入れると 245KB → 615KB になります。gzip 後、1 ページあたり）。
  -->
  <?!= include('fonts'); ?>
  
</head>
<body>
  <div id="root"></div>

  <?!= include('app'); ?>

</body>
</html>
