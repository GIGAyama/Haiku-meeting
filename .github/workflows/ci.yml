name: CI

# pull_request でも動かす。push だけだと、取り込む前に落ちていることに気づけない。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる（版は package-lock.json で固定）
        run: npm ci

      - name: 生成物を作り直す
        run: npm run build

      # 以下の検査の中身は package.json の check:* に置いてある。
      # main へのマージで走る Deploy も同じ package.json の check を通るので、
      # ここに検査そのものを直接書くと「CI では見ているのに、本番反映では
      # 見ていない」検査ができてしまう。名前だけを呼ぶ。
      #
      # このリポジトリでいちばん起きやすい事故。
      # src/app.jsx を直したのに npm run build を忘れると、変更が画面に出ない。
      # 生成物は配信されるファイルそのものなので、ここで差分が出たら止める。
      - name: 生成物が原本と一致しているか（build の忘れを止める）
        run: |
          if ! npm run --silent check:built; then
            echo "::error::src/app.jsx や tools/extra.css を直したあと npm run build を走らせていません。"
            echo "手元で npm run build を実行し、app.html / css.html / vendor.html も一緒にコミットしてください。"
            exit 1
          fi

      - name: 品質ゲート
        run: npm run check:gate

      # 「0件でした」だけでは、検査が動いているのか何も見ていないのか区別できない。
      - name: 品質ゲート自体を、わざと壊して確かめる
        run: npm run check:self-test

      - name: 管理者APIの認可（合鍵なしで弾かれるか）
        run: npm run check:admin

      # 児童の書いた文字が、先生の表計算のなかで数式として動き出さないか。
      - name: 表計算に数式として書かれないか
        run: npm run check:cell

      # 外枠のファイル名。前の版を貼ったままの学級でも画面が出るか。
      - name: 外枠（app-shell）の読み分け
        run: npm run check:shell

      # 作品を入れる表計算ファイルの取り方。前の配り方の学級を止めていないか。
      - name: 表計算ファイルの取り方（コピー配布と独立スクリプトの両方）
        run: npm run check:bound

      # シートの列がずれたときに、気づけるか・勝手に直していないか。
      - name: シートの作りの点検
        run: npm run check:shape

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
